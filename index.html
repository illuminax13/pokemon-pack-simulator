<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Pokémon Pack Simulator</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pack Sim">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="assets/icons/favicon-64.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://assets.tcgdex.net" crossorigin><link rel="preconnect" href="https://images.pokemontcg.io" crossorigin><link rel="dns-prefetch" href="https://api.tcgdex.net">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd54a;--gold2:#ff9f1c;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#e9ecff}
*{box-sizing:border-box}
body{margin:0;font-family:Outfit,system-ui,"Segoe UI",sans-serif;color:var(--txt);min-height:100vh;overflow-x:hidden;background:#05060f}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(1200px 700px at 15% 10%,#3b1d7a55,transparent 60%),radial-gradient(900px 600px at 85% 20%,#0d6efd44,transparent 60%),radial-gradient(1000px 800px at 50% 110%,#ff2e6340,transparent 60%),#05060f;animation:bgshift 18s ease-in-out infinite alternate}
@keyframes bgshift{to{filter:hue-rotate(40deg)}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 28px;background:rgba(8,10,25,.55);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
h1{margin:0 14px 0 0;font-family:Orbitron,Outfit,sans-serif;font-size:22px;letter-spacing:2px;background:linear-gradient(90deg,#fff6c9,var(--gold),var(--gold2),#fff6c9);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200%}}
button{font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.5px;padding:10px 20px;border-radius:999px;border:1px solid #ffffff30;cursor:pointer;color:#1b1300;
 background:linear-gradient(180deg,#ffe78a,#ffc22e 55%,#f29d0c);box-shadow:0 6px 20px #ffb40040,inset 0 1px 0 #fff8,inset 0 -2px 0 #0003;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 30px #ffb40070,inset 0 1px 0 #fff8}button:active{transform:translateY(1px) scale(.98)}
button:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none;box-shadow:none}
button.ghost{background:var(--glass);color:var(--txt);box-shadow:none;backdrop-filter:blur(8px)}
.stats{margin-left:auto;font-size:14px;color:#b9bfe6;display:flex;gap:16px;align-items:center}.stats b{color:var(--gold);font-size:16px}.stats a{color:#ff8fa3;text-decoration:none}
#status{padding:14px 28px 0;font-size:15px;color:#a9c4ff;font-weight:300;letter-spacing:.3px}
.view{display:none}.view.on{display:block;animation:viewin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}}
/* set picker */
#sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:28px;max-width:1240px;margin:auto}
.tile{position:relative;padding:26px 20px 20px;text-align:center;cursor:pointer;border-radius:22px;background:linear-gradient(160deg,#ffffff14,#ffffff04);border:1px solid var(--line);backdrop-filter:blur(14px);
 box-shadow:0 20px 40px #0006,inset 0 1px 0 #ffffff22;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;overflow:hidden;animation:viewin .6s backwards}
.tile:before{content:"";position:absolute;inset:-1px;background:radial-gradient(400px 160px at var(--x,50%) -10%,var(--c1),transparent 70%);opacity:.35;transition:.35s}
.tile:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff30,transparent);transform:skewX(-20deg);transition:left .7s}
.tile:hover{transform:translateY(-8px) scale(1.03);border-color:#ffd54a88;box-shadow:0 30px 60px #0008,0 0 40px var(--c1)}.tile:hover:before{opacity:.7}.tile:hover:after{left:130%}
.tile .logo{height:110px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.tile .logo img{max-height:110px;max-width:100%;filter:drop-shadow(0 8px 14px #000a)}
.tile .sym{position:absolute;top:14px;right:14px;height:24px;z-index:1;filter:drop-shadow(0 0 4px #fff6)}
.tile h3{position:relative;z-index:1;margin:14px 0 2px;font-weight:700;font-size:19px;color:#fff}.tile small{position:relative;z-index:1;color:#9aa3d6;letter-spacing:2px}
.txtlogo{font-family:Orbitron,sans-serif;font-size:24px;color:var(--gold)}
/* wheel */
#wheelwrap{position:relative;overflow:hidden;height:400px;margin:26px 0 18px;background:linear-gradient(180deg,#00000055,#ffffff08,#00000055);border-block:1px solid #ffd54a55;box-shadow:inset 0 0 80px #000c}
#wheelwrap:before,#wheelwrap:after{content:"";position:absolute;top:0;bottom:0;width:26%;z-index:2;pointer-events:none}
#wheelwrap:before{left:0;background:linear-gradient(90deg,#05060f,#05060f99 40%,transparent)}#wheelwrap:after{right:0;background:linear-gradient(-90deg,#05060f,#05060f99 40%,transparent)}
#pointer{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);z-index:3;background:linear-gradient(180deg,var(--gold),transparent 25%,transparent 75%,var(--gold));filter:drop-shadow(0 0 8px var(--gold))}
#pointer:before,#pointer:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:14px solid transparent}
#pointer:before{top:0;border-top:22px solid var(--gold)}#pointer:after{bottom:0;border-bottom:22px solid var(--gold)}
#strip{position:absolute;top:50px;left:0;display:flex;gap:20px;will-change:transform}
.pack{width:160px;height:290px;flex:none;position:relative;transition:transform .18s;filter:drop-shadow(0 18px 18px #000b) drop-shadow(0 0 0 transparent);transform-style:preserve-3d}
.pk{position:absolute;inset:0;border-radius:6px;overflow:hidden;
 clip-path:polygon(0 2%,4% 0,8% 2%,12% 0,16% 2%,20% 0,24% 2%,28% 0,32% 2%,36% 0,40% 2%,44% 0,48% 2%,52% 0,56% 2%,60% 0,64% 2%,68% 0,72% 2%,76% 0,80% 2%,84% 0,88% 2%,92% 0,96% 2%,100% 0,100% 100%,96% 98%,92% 100%,88% 98%,84% 100%,80% 98%,76% 100%,72% 98%,68% 100%,64% 98%,60% 100%,56% 98%,52% 100%,48% 98%,44% 100%,40% 98%,36% 100%,32% 98%,28% 100%,24% 98%,20% 100%,16% 98%,12% 100%,8% 98%,4% 100%,0 98%)}
.pk:before,.pk:after{content:"";position:absolute;left:0;right:0;height:7%;z-index:3;background:repeating-linear-gradient(90deg,#fff3 0 2px,#0003 2px 5px),linear-gradient(180deg,#ffffff70,#a0a0a050)}
.pk:before{top:0}.pk:after{bottom:0}
.pk .metal{position:absolute;inset:0;background:linear-gradient(90deg,#0006,transparent 18%,#fff2 50%,transparent 82%,#0007);z-index:2;pointer-events:none}
.pack .art{position:absolute;left:9%;right:9%;top:27%;height:55%;background-size:185%;background-position:50% 20%;border-radius:8px;box-shadow:0 0 0 2px #fff9,0 8px 20px #0008}
.pack .plogo{position:absolute;top:8%;left:8%;right:8%;height:18%;display:flex;align-items:center;justify-content:center;z-index:2}.pack .plogo img{max-width:100%;max-height:100%;filter:drop-shadow(0 3px 4px #000a)}
.pack .foil{position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 20%,#ff00c855 35%,#00e5ff55 45%,#fff70055 55%,transparent 70%);background-size:250% 100%;mix-blend-mode:color-dodge;animation:foilmove 4s linear infinite;opacity:.7}
@keyframes foilmove{from{background-position:120% 0}to{background-position:-120% 0}}
.pack .pname{position:absolute;bottom:9%;width:100%;text-align:center;font-size:10px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 1px 3px #000;z-index:2;padding:0 6px}
.pack.tick{transform:scale(1.1) translateY(-6px);filter:drop-shadow(0 22px 22px #000c) drop-shadow(0 0 16px var(--gold))}
.pack.landed{animation:land 1.1s cubic-bezier(.2,.8,.2,1) forwards;z-index:5}
@keyframes land{40%{transform:scale(1.4) translateY(-10px)}100%{transform:scale(1.28) translateY(-6px);filter:drop-shadow(0 0 40px var(--gold)) drop-shadow(0 0 80px var(--gold2))}}
.ctrls{text-align:center}.ctrls button{font-size:20px;padding:14px 44px;margin:0 10px;font-family:Orbitron,Outfit,sans-serif;letter-spacing:2px}
/* tear overlay */
#tear{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#000a,#000e);backdrop-filter:blur(6px)}
#tear.on{display:flex}#tear .pack{width:240px;height:435px;animation:tearin .6s cubic-bezier(.2,.8,.2,1)}
#tear .pack .pname{font-size:14px}
@keyframes tearin{from{transform:scale(.5) rotateY(-40deg);opacity:0}}
#tear .top{position:absolute;inset:0;clip-path:inset(0 0 86% 0)}#tear .bot{position:absolute;inset:0;clip-path:inset(14% 0 0 0)}
#tear.rip .top{animation:rip .7s cubic-bezier(.5,0,.7,.4) forwards}#tear.rip .bot{animation:drop .7s .45s ease-in forwards}
@keyframes rip{30%{transform:translate(10px,-6px) rotate(4deg)}100%{transform:translate(260px,-320px) rotate(55deg);opacity:0}}
@keyframes drop{to{transform:translateY(120vh) rotate(-8deg)}}
#tear .glowline{position:absolute;left:-10%;right:-10%;top:14%;height:6px;background:radial-gradient(#fff,var(--gold) 40%,transparent 70%);opacity:0;filter:blur(2px)}
#tear.rip .glowline{animation:gl .9s forwards}@keyframes gl{20%{opacity:1;transform:scaleY(3)}100%{opacity:0;transform:scaleY(30)}}
/* cards */
#board{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding:30px 20px;perspective:1400px;max-width:1300px;margin:auto}
.card{width:200px;height:279px;position:relative;cursor:pointer;animation:deal .55s cubic-bezier(.2,.8,.2,1) backwards;--rx:0deg;--ry:0deg;--mx:50%;--my:50%}
.inner{position:absolute;inset:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform:rotateX(var(--rx)) rotateY(var(--ry))}
.card.flipped .inner{transform:rotateY(180deg) rotateX(var(--rx)) rotateY(var(--ry))}
.card.flipped.tilting .inner{transition:transform .08s}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:11px;overflow:hidden;box-shadow:0 14px 30px #000a}
.back{background:url(assets/card-back.jpg) center/cover no-repeat,radial-gradient(circle at 50% 50%,#3a6ff7,#163b9b 60%,#0b1f5c);border:0;display:flex;align-items:center;justify-content:center}
.back:before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg,#ffffff0a 0 6deg,transparent 6deg 12deg)}
.back:after{content:"";width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,#fff 18%,#222 19% 26%,transparent 27%),linear-gradient(#e53935 46%,#222 46% 54%,#f5f5f5 54%);box-shadow:0 0 0 5px #222,0 6px 16px #000a;position:relative}
.card:not(.flipped):hover .inner{transform:translateY(-8px) rotateX(8deg)}
.front{transform:rotateY(180deg);background:#111}.front img{width:100%;height:100%;object-fit:cover;display:block}
.front .foil,.front .glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
.front .glare{background:radial-gradient(circle at var(--mx) var(--my),#ffffffb0,#ffffff20 25%,transparent 55%);mix-blend-mode:overlay}
.card.tilting .glare{opacity:.8}
.front .foil{background:repeating-linear-gradient(115deg,#ff0077 0%,#ffcc00 6%,#33ff99 12%,#00ccff 18%,#a64dff 24%,#ff0077 30%),radial-gradient(circle at var(--mx) var(--my),#fff,transparent 60%);background-size:300% 300%,100%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge;filter:brightness(.6) contrast(1.4)}
.rev .foil{opacity:.25}.hit .foil{opacity:.4}.big .foil{opacity:.55}.hit.tilting .foil{opacity:.6}.big.tilting .foil{opacity:.8}
.big .front .foil{background-blend-mode:hard-light}
.tag{position:absolute;bottom:-34px;left:0;right:0;font-size:12px;text-align:center;color:#c8cff5;opacity:0;transition:opacity .4s .5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.flipped .tag{opacity:1}.card{margin-bottom:30px}
.hit.flipped .front{box-shadow:0 0 22px 4px #ffd54acc}
.big.flipped .front{box-shadow:0 0 26px 6px #ff4ff8,0 0 46px 10px #4fe3ff;animation:pulse 1.6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 34px 8px #4fe3ff,0 0 60px 14px #ff4ff8}}
.lastslot:not(.flipped) .back{border-color:#fff;animation:tease 1.2s infinite alternate}@keyframes tease{to{box-shadow:0 0 30px 6px #fff,0 0 60px #ffd54a}}
@keyframes deal{from{opacity:0;transform:translateY(-120px) rotate(-12deg) scale(.5)}}
#burst{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--bx,50%) var(--by,50%),#fffbe6,#ffd54acc 10%,#ff4ff855 30%,transparent 60%)}
#burst.go{animation:burst 1.2s ease-out}@keyframes burst{10%{opacity:1}100%{opacity:0}}
.shake{animation:shake .5s}@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
/* panels */
section{margin:26px auto;max-width:1240px;padding:18px 24px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
h2{margin:0 0 12px;font-family:Orbitron,Outfit,sans-serif;font-size:15px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
#coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
#coll div{position:relative;transition:transform .2s}#coll div:hover{transform:scale(1.12);z-index:2}
#coll img,#coll .ph{width:100%;aspect-ratio:63/88;border-radius:6px;box-shadow:0 6px 14px #0008;font-size:10px}
#coll span{position:absolute;top:4px;right:4px;background:linear-gradient(#ff5470,#d6204a);border-radius:9px;padding:0 7px;font-size:11px;font-weight:700}
#hist{font-size:13px;max-height:180px;overflow:auto;color:#b9bfe6;line-height:1.7}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:10px;text-align:center;background:linear-gradient(160deg,#ffd54a,#3c5aa6);color:#111;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#wheelwrap,#tear{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wheelwrap{cursor:grab}#wheelwrap.drag{cursor:grabbing}#strip img,#tear img{pointer-events:none;-webkit-user-drag:none}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;padding:8px 18px 8px 50px;border-radius:999px;background:#0009;border:1px solid #ffffff30;backdrop-filter:blur(8px);font-weight:500;letter-spacing:1px;font-size:14px;color:#fff;display:flex;gap:10px;align-items:center;pointer-events:none;transition:opacity .4s}
.hint.off{opacity:0}.hand{display:inline-block;font-size:20px;animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%{transform:translateX(18px) rotate(10deg);opacity:0}20%{opacity:1}70%{transform:translateX(-22px) rotate(-10deg);opacity:1}100%{transform:translateX(-26px);opacity:0}}
#tear .hint{bottom:auto;top:calc(50% - 280px)}#tear .tp{cursor:ew-resize}
#tear .top{transform-origin:100% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}#tear.drag .top{transition:none}
#tear .seam{position:absolute;left:0;top:14%;height:4px;width:0;z-index:6;background:linear-gradient(90deg,#fff,var(--gold));box-shadow:0 0 12px #fff,0 0 24px var(--gold);border-radius:4px;transition:width .45s}
#tear.drag .seam{transition:none}
#tear .zone{position:absolute;left:-30px;right:-30px;top:-30px;height:calc(14% + 60px);z-index:7;border:2px dashed #ffffff55;border-radius:12px;animation:zp 1.4s infinite alternate}
@keyframes zp{to{border-color:#ffd54a;box-shadow:0 0 20px #ffd54a66}}#tear.drag .zone,#tear.rip .zone,#tear.rip .hint{opacity:0}
.face.back{-webkit-transform:translateZ(1.6px);transform:translateZ(1.6px)}.front{-webkit-transform:rotateY(180deg) translateZ(1.6px);transform:rotateY(180deg) translateZ(1.6px)}
.slice{position:absolute;inset:0;border-radius:11px;background:linear-gradient(90deg,#d9d9d9,#9a9a9a,#e8e8e8);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.front .sparkle{position:absolute;inset:0;pointer-events:none;opacity:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 2px),radial-gradient(circle,#fff8 0 1px,transparent 2px);background-size:23px 29px,37px 31px;background-position:calc(var(--mx)*.4) calc(var(--my)*.3),calc(var(--mx)*-.3) var(--my);mix-blend-mode:color-dodge;transition:opacity .3s}
.hit .sparkle{opacity:.35}.big .sparkle{opacity:.6}.big.tilting .sparkle{opacity:1}
.front:before{content:"";position:absolute;inset:0;z-index:3;border-radius:11px;box-shadow:inset 0 0 0 1px #fff4,inset 0 0 18px #0006;pointer-events:none}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#wheelwrap.three #strip{opacity:0}#wheelwrap.three #pointer{opacity:.5}
#tear.three .tp>.pack,#tear.three .seam,#tear.three .glowline{opacity:0}
#tear.three .zone{z-index:7}#tear.three .tp{animation:none}#tear>#c3d{position:fixed;z-index:0}#tear .tp,#tear .hint{z-index:2}
#badge{display:none;position:fixed;right:10px;bottom:10px;z-index:99;font:700 11px/1 Outfit,sans-serif;letter-spacing:1px;padding:6px 10px;border-radius:999px;background:#000c;border:1px solid #fff4;color:#fff}
#badge.three{border-color:#4fe3ff;color:#4fe3ff}#badge.css{border-color:#ff8fa3;color:#ff8fa3}
.back:before,.back:after{display:none}.back .cbimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;border-radius:4px}
#stageui{display:none}
#vWheel.stage{position:fixed;inset:0;z-index:30;background:#04050d;animation:stagein .7s ease}
@keyframes stagein{from{opacity:0}}
#vWheel.stage #wheelwrap{position:absolute;inset:0;height:auto;margin:0;border:0;background:none;box-shadow:none}
#vWheel.stage #wheelwrap:before,#vWheel.stage #wheelwrap:after{display:none}#vWheel.stage #pointer{display:none}
#vWheel.stage #stageui{display:flex;position:absolute;top:0;left:0;right:0;z-index:5;padding:16px 20px;gap:14px;align-items:center;pointer-events:none;background:linear-gradient(#000a,transparent)}
#stageui button{pointer-events:auto}#sstatus{flex:1;font-weight:500;color:#dfe6ff;text-shadow:0 2px 6px #000}.sstats{color:#b9bfe6}.sstats b{color:var(--gold)}
#vWheel.stage .hint{bottom:36px;font-size:16px;padding-left:48px}
body.staged{overflow:hidden}
.pk.real img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pk.real:before,.pk.real:after{display:none}.pk.real .foil{opacity:.3}.pk.real .metal{opacity:.6}
/* backface-independent face swap (WebKit/iOS safe) */
.card .front{visibility:hidden;transition:visibility 0s .3s}.card.flipped .front{visibility:visible}
.card .back{visibility:visible;transition:visibility 0s .3s}.card.flipped .back{visibility:hidden}
.card.flipped .slice{visibility:hidden}
#board.stackmode{display:flex;flex-direction:column;align-items:center;max-width:none;padding:10px 12px 30px;gap:14px}
#counter{font-family:Orbitron,Outfit,sans-serif;font-size:18px;letter-spacing:3px;color:var(--gold);text-shadow:0 0 12px #ffd54a66}
#stack{position:relative;width:min(72vw,300px);aspect-ratio:63/88;touch-action:none;user-select:none;-webkit-user-select:none;perspective:1400px}
#stack .card{position:absolute;inset:0;width:auto;height:auto;margin:0;transform:var(--off);transition:transform .35s;animation:stackin .5s cubic-bezier(.2,.8,.2,1) backwards}
#stack .card .tag{display:none}#stack .card .face{border-radius:4.5%/3.3%}
@keyframes stackin{from{opacity:0;transform:translateY(-60vh) rotate(-20deg) scale(.7)}}
#tray{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:62px;max-width:96vw}
.mini{width:44px;aspect-ratio:63/88;border-radius:4px;overflow:hidden;box-shadow:0 4px 10px #0009;animation:minin .4s cubic-bezier(.2,1.4,.4,1)}.mini img,.mini .ph{width:100%;height:100%;object-fit:cover;font-size:6px;padding:2px}
@keyframes minin{from{transform:scale(0) rotate(-30deg)}}
#summary{display:none;width:100%}#summary.on{display:block;animation:viewin .5s}
.sgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;perspective:1400px;max-width:1300px;margin:auto}
.sgrid .card{width:min(42vw,200px);height:auto;aspect-ratio:63/88}
.sbtn{text-align:center;margin:26px 0 6px}.sbtn button{font-size:18px;padding:14px 40px}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px;padding:30px;max-width:1200px;margin:auto;perspective:1200px}
.binder{position:relative;aspect-ratio:3/3.8;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1);animation:viewin .6s backwards;transform-style:preserve-3d}

/* ===== polish pass: design tokens ===== */
:root{--bg0:#06070f;--bg1:#0c0f1f;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e6e9f7;--mut:#9aa3c7;

 --sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px)}
body{background:var(--bg0);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:.1px}
#bg{opacity:.75}

h1{font-size:18px;letter-spacing:3px;margin-right:6px}
button{font-size:14px;padding:9px 18px;border-radius:999px;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,filter .2s,background .2s;box-shadow:0 4px 14px rgba(255,180,0,.22),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.18)}
button:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(255,180,0,.32),inset 0 1px 0 rgba(255,255,255,.55)}
button:active{transform:scale(.94);transition-duration:.06s}
button:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
button.ghost:hover{background:rgba(255,255,255,.1)}
.stats{gap:8px;font-size:13px}.stats span{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.stats b{font-size:14px}
#status{padding:12px calc(22px + var(--sa-l)) 0;font-size:14px;color:var(--mut)}
.view.on{animation:viewin2 .45s cubic-bezier(.2,.8,.2,1)}@keyframes viewin2{from{opacity:0;transform:translateY(14px)}}
section{border-radius:var(--r-lg);background:var(--panel);border-color:var(--line);box-shadow:var(--sh1)}

.tile:before{opacity:.22}.tile:hover{transform:translateY(-5px);box-shadow:var(--sh3),0 0 0 1px rgba(255,213,74,.35)}.tile:hover:before{opacity:.4}.tile:active{transform:scale(.97)}
.tile h3{font-size:17px;letter-spacing:.3px}.tile small{font-size:11px;letter-spacing:3px}

.skel:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shim 1.3s infinite}

.bload{padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(calc(100vw - 60px),420px);aspect-ratio:8.5/11}.bload .skel{border-radius:6px}

#vShelf.on{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45)),repeating-linear-gradient(90deg,#2a1b12 0 3px,#2f1f15 3px 7px,#28190f 7px 12px),#2a1b12;min-height:calc(100vh - 120px);box-shadow:inset 0 30px 60px rgba(0,0,0,.6)}
#shelf{gap:34px 26px;padding:34px calc(30px + var(--sa-r)) 50px calc(30px + var(--sa-l))}
.binder{filter:drop-shadow(0 14px 12px rgba(0,0,0,.55))}.binder:after{content:"";position:absolute;left:-16px;right:-16px;bottom:-16px;height:12px;border-radius:2px;background:linear-gradient(#5b3b27,#3a2416 60%,#24160d);box-shadow:0 8px 14px rgba(0,0,0,.6);transform:translateZ(-1px)}

 repeating-radial-gradient(circle at 37% 61%,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),linear-gradient(160deg,var(--a),color-mix(in srgb,var(--a) 55%,#000) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset -8px 0 14px rgba(0,0,0,.35)}
.binder .cover:before{content:"";position:absolute;inset:7px 7px 7px calc(14% + 6px);border:1.5px dashed rgba(255,255,255,.22);border-radius:6px;pointer-events:none}
.binder .spine{background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.12) 45%,rgba(0,0,0,.45)),color-mix(in srgb,var(--a) 70%,#000)}
.binder:hover{transform:translateY(-6px) rotateY(-10deg)}.binder:active{transform:scale(.97)}
.bname{font-size:14px}.bprog{height:6px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
/* binder pages */
.book{background:linear-gradient(160deg,#241c2e,#151019);border-radius:var(--r);box-shadow:var(--sh3),inset 0 0 0 1px rgba(255,255,255,.06)}
.page{background:linear-gradient(180deg,#ddd8ce,#cfc9bd);box-shadow:inset 0 0 40px rgba(0,0,0,.18)}
.pocket{border-radius:4px;background:#c4bdb0;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}

.sleeve{background:linear-gradient(118deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 18%,transparent 36%,transparent 64%,rgba(255,255,255,.08) 82%,rgba(255,255,255,.2) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 7px 0 -5px rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.12)}
.pocket.own:hover .sleeve{background:linear-gradient(118deg,rgba(255,255,255,.36),rgba(255,255,255,.08) 22%,transparent 40%)}
.pocket.own:active{transform:scale(.96)}.pocket{transition:transform .12s}
#bbar h3{font-size:15px}
/* stack reveal on playmat */
#vPack.on{background:radial-gradient(90% 70% at 50% 35%,#16304a,#0b1726 55%,#070b14);min-height:calc(100svh - 70px)}
#board.stackmode{position:relative;padding:14px 12px calc(110px + var(--sa-b));gap:12px}
#board.stackmode:before{content:"";position:absolute;left:50%;top:44px;transform:translateX(-50%);width:min(92vw,440px);aspect-ratio:1/1.12;border-radius:28px;
 background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.05),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),#0f2233;
 box-shadow:inset 0 0 0 2px rgba(255,213,74,.12),inset 0 0 60px rgba(0,0,0,.5),0 20px 50px rgba(0,0,0,.4);pointer-events:none}
#board.stackmode.done:before{display:none}
#counter{position:relative;z-index:1;font-size:14px;letter-spacing:3px;padding:6px 16px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,213,74,.25);color:#ffe38a;text-shadow:none}
#stack{z-index:1;width:min(72vw,300px,calc((100svh - 300px) * .716));margin-top:18px}
#stack .card .face{box-shadow:0 2px 3px rgba(0,0,0,.35)}#stack .card[data-i]:first-child .face{box-shadow:0 18px 40px rgba(0,0,0,.55)}
#stack .card:active{transition:transform .08s}
#tray{position:fixed;left:0;right:0;bottom:0;z-index:25;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;gap:6px;min-height:0;max-width:none;
 padding:10px calc(14px + var(--sa-r)) calc(10px + var(--sa-b)) calc(14px + var(--sa-l));background:rgba(6,8,16,.88);border-top:1px solid var(--line);scrollbar-width:none}
#tray:empty{display:none}#tray::-webkit-scrollbar{display:none}
.mini{flex:none;width:40px;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.6)}
/* rarity holo refinements */
.rev .foil{opacity:.18}.hit .foil{opacity:.3}.big .foil{opacity:.42}.hit.tilting .foil{opacity:.45}.big.tilting .foil{opacity:.62}
.front .glare{mix-blend-mode:soft-light}.card.tilting .glare{opacity:.55}
.hit.flipped .front{box-shadow:0 0 18px 2px rgba(255,213,74,.45)}
.big.flipped .front{box-shadow:0 0 20px 3px rgba(255,79,248,.4),0 0 36px 6px rgba(79,227,255,.25)}
@keyframes pulse{to{box-shadow:0 0 26px 5px rgba(79,227,255,.4),0 0 44px 9px rgba(255,79,248,.25)}}
.sgrid{gap:16px}.sbtn button{font-size:16px}
#viewer{padding:var(--sa-t) 0 var(--sa-b)}

#vWheel.stage #stageui{padding:calc(14px + var(--sa-t)) calc(18px + var(--sa-r)) 14px calc(18px + var(--sa-l))}

 #status{font-size:13px;padding-top:8px}#sets{grid-template-columns:1fr 1fr;gap:12px;padding:14px}.tile{padding:14px 10px 12px}.tile .logo{height:70px}.tile .logo img{max-height:70px}.tile h3{font-size:14px}
 #shelf{grid-template-columns:1fr 1fr;gap:26px 18px;padding:22px 18px 40px}section{margin:18px 10px}}
/* crisp binders at high DPR: no filter/3D raster layers */
.binder,.binder:hover,.binder:active{filter:none;transform-style:flat;will-change:auto}
.binder:hover{transform:translateY(-6px)}.binder:active{transform:translateY(-2px) scale(.98)}
.binder .cover{box-shadow:0 14px 18px -6px rgba(0,0,0,.6),0 4px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08),inset -8px 0 14px rgba(0,0,0,.35)}
.binder:after{transform:none}
.blogo img{filter:none;image-rendering:auto}
.pocket img{image-rendering:auto}
/* ---- coverflow wheel (TCG Pocket style: bright, crisp DOM art) ---- */
#vWheel.stage{background:linear-gradient(180deg,#c6d6e8 0%,#dfe9f4 30%,#f3f7fb 58%,#ffffff 72%,#e9f0f7 100%)}
#vWheel.stage #sstatus{visibility:hidden}#vWheel.stage .hint{white-space:nowrap}

 -webkit-box-reflect:below 4px linear-gradient(transparent 52%,rgba(255,255,255,.32))}

 background:rgba(255,255,255,.85);border:1px solid rgba(30,50,80,.15);box-shadow:0 4px 14px rgba(30,50,80,.18);color:#33445c}

 t.querySelectorAll("img[data-src]").forEach(im=>{im.src=im.dataset.src;im.removeAttribute("data-src")});t.classList.add("on");$("status").textContent="Swipe across the top seal to tear it open!";
 const pk=t.querySelector(".tp"),bot=t.querySelector(".bot"),top=t.querySelector(".top"),gap=t.querySelector(".gap"),flw=t.querySelector(".flapw"),flap=t.querySelector(".flap"),silver=t.querySelector(".silver"),
  fl1=t.querySelector(".fibers polyline"),fl2=t.querySelector(".ff polyline");let st=null,done=false,cur=0,cdir=1,anim=0;Object.defineProperty(window,"__tearCur",{get:()=>cur,configurable:true});

  const e=Math.min(1,q*1.6),ang=dir*(6+q*42)*e;flw.style.transformOrigin=`${tipX}% ${tipY}%`;

function twinkle(host,x,y,n,w=0){const cols=["#ffffff","#bfe4ff","#ffe7a3","#ffc6ea","#c9f2ff"];for(let k=0;k<n;k++){const e=document.createElement("b");e.className="twk";const a=Math.random()*Math.PI*2,d=30+Math.random()*90;
 e.style.cssText=`left:${x+(Math.random()-.5)*w}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--c:${cols[k%cols.length]};--s:${(.5+Math.random()*.9).toFixed(2)};animation-delay:${(Math.random()*.15).toFixed(2)}s`;host.appendChild(e);setTimeout(()=>e.remove(),1300)}}

const cv=$("fx"),cx=cv.getContext("2d");let P=[],S=[];
